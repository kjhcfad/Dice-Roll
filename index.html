<!DOCTYPE HTML>
<html>
<head>
	<!--Head shows files that the website doesn't show on its main page. -->
	<title>Dice Roll LTD.</title>
	  <link rel="stylesheet" href="styles.css">
	  <script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js"></script>
</head>

<body>
<h1>Dice Roll LTD.</h1>
<div class="box"></div>
<p id="output"></p>

<script>
	let sides = prompt('How many sides do you want?')
	document.write ("Input = " + sides);
	document.getElementById("output").innerHTML =
	"You rolled a " + (Math.floor(Math.random() * sides) +1 ); 
</script>

<script>
    const { animate } = anime;

    animate('.box', {
        opacity: [0, 1],
        y: [50, 0],
        duration: 1000,
        ease: 'outExpo'
    });
</script>

</body>
</html>
